<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plow Heroes — redirecting to www.plowheroes.com</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://www.plowheroes.com/" />
    <meta http-equiv="refresh" content="0; url=https://www.plowheroes.com/" />
    <script>
      // Keep the page path, query and #section the visitor asked for.
      location.replace(
        "https://www.plowheroes.com" +
          location.pathname +
          location.search +
          location.hash,
      );
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: #171d21;
        color: #f4f7f8;
      }
      a {
        color: #ffd22c;
      }
    </style>
  </head>
  <body>
    <p>
      Plow Heroes has moved to
      <a href="https://www.plowheroes.com/">www.plowheroes.com</a>.
    </p>
  </body>
</html>
